
name: Koi Aquarium

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate White Koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: .koi-build/white

      - name: Generate Black Koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: black
          output-dir: .koi-build/black

      - name: Generate Gold Koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: gold
          output-dir: .koi-build/gold

      - name: Arrange aquarium
        run: |
          mkdir -p koi

          cp .koi-build/white/koi.gif koi/koi.gif
          cp .koi-build/black/koi.gif koi/koi2.gif
          cp .koi-build/gold/koi.gif koi/koi3.gif

      - name: Commit aquarium
        run: |
          git add koi/koi.gif koi/koi2.gif koi/koi3.gif

          if git diff --cached --quiet; then
            echo "No fish changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update GitHub Koi Aquarium"
          git push

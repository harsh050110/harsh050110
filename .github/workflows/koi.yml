
name: Koi Aquarium

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Install git-koi only once
      - name: Install git-koi
        run: cargo install git-koi --locked

      # Collect GitHub activity only once
      - name: Collect GitHub Activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-koi collect harsh050110 \
            --output "$RUNNER_TEMP/koi-snapshot.json"

      # Generate all six koi using the same snapshot
      - name: Generate White Koi
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/white --body white

      - name: Generate Black Koi
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/black --body black

      - name: Generate Gold Koi
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/gold --body gold

      - name: Generate Asagi Koi
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/asagi --body asagi

      - name: Generate Tea Koi
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/tea --body tea

      - name: Generate Platinum Koi
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/platinum --body platinum

      # Arrange aquarium
      - name: Arrange Aquarium
        shell: bash
        run: |
          cp koi/white/koi.gif koi/koi.gif
          cp koi/black/koi.gif koi/koi2.gif
          cp koi/gold/koi.gif koi/koi3.gif
          cp koi/asagi/koi.gif koi/koi4.gif
          cp koi/tea/koi.gif koi/koi5.gif
          cp koi/platinum/koi.gif koi/koi6.gif

          for file in koi/koi{,2,3,4,5,6}.gif; do
            test -s "$file" || {
              echo "Missing or empty GIF: $file"
              exit 1
            }
          done

          echo "All six koi generated successfully!"

      # Commit aquarium
      - name: Commit Aquarium
        shell: bash
        run: |
          git add koi/

          if git diff --cached --quiet; then
            echo "Aquarium unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update GitHub Koi Aquarium"
          git push


name: Koi Aquarium

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Collect activity and generate the first fish
      - name: Generate White Koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi/white

      # Reuse the collected activity for the other fish
      - name: Generate Black and Gold Koi
        shell: bash
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/black --body black

          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/gold --body gold

      # Commit all three fish
      - name: Commit aquarium
        shell: bash
        run: |
          git add koi/

          if git diff --cached --quiet; then
            echo "Aquarium unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update GitHub aquarium"
          git push


name: Koi Aquarium

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate White Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: harsh050110
          body: white
          output-dir: koi/white

      - name: Generate Black and Gold Koi
        shell: bash
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/black --body black

          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/gold --body gold

      - name: Generate Asagi Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: harsh050110
          body: asagi
          output-dir: koi/asagi

      - name: Generate Tea Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: harsh050110
          body: tea
          output-dir: koi/tea

      - name: Generate Platinum Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: harsh050110
          body: platinum
          output-dir: koi/platinum

      - name: Arrange aquarium
        shell: bash
        run: |
          mkdir -p koi

          cp koi/white/koi.gif koi/koi.gif
          cp koi/black/koi.gif koi/koi2.gif
          cp koi/gold/koi.gif koi/koi3.gif
          cp koi/asagi/koi.gif koi/koi4.gif
          cp koi/tea/koi.gif koi/koi5.gif
          cp koi/platinum/koi.gif koi/koi6.gif

          for file in koi/koi{,2,3,4,5,6}.gif; do
            test -s "$file" || exit 1
          done

      - name: Commit aquarium
        shell: bash
        run: |
          git add koi/

          if git diff --cached --quiet; then
            echo "Aquarium unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update GitHub Koi Aquarium"
          git push


name: Koi Aquarium

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This collects GitHub activity and installs git-koi
      - name: Generate White Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: harsh050110
          body: white
          output-dir: koi/white

      # Reuse the same activity snapshot
      - name: Generate Black and Gold Koi
        shell: bash
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/black --body black

          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/gold --body gold


            
      # Generate additional fish using the same activity snapshot
      - name: Generate Asagi Koi
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/asagi --body asagi

      - name: Generate Tea Koi
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/tea --body tea

      - name: Generate Platinum Koi
        run: |
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi/platinum --body platinum


      # Put all three GIFs in your existing locations
      - name: Arrange aquarium
        shell: bash
        run: |
          mkdir -p koi

          cp koi/white/koi.gif koi/koi.gif
          cp koi/black/koi.gif koi/koi2.gif
          cp koi/gold/koi.gif koi/koi3.gif
          cp koi/asagi/koi.gif koi/koi4.gif
          cp koi/tea/koi.gif koi/koi5.gif
          cp koi/platinum/koi.gif koi/koi6.gif

          test -s koi/koi.gif
          test -s koi/koi2.gif
          test -s koi/koi3.gif
          test -s koi/koi4.gif
          test -s koi/koi5.gif
          test -s koi/koi6.gif

      # Commit all fish
      - name: Commit aquarium
        shell: bash
        run: |
          git add koi/koi.gif koi/koi2.gif koi/koi3.gif

          if git diff --cached --quiet; then
            echo "Aquarium unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update GitHub Koi Aquarium"
          git push

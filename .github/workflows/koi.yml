
name: Koi Aquarium

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # White Koi
      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi/white

      # Black Koi
      - uses: yalongwastaken/git-koi@v1
        with:
          body: black
          output-dir: koi/black

      # Gold Koi
      - uses: yalongwastaken/git-koi@v1
        with:
          body: gold
          output-dir: koi/gold

      - name: Commit aquarium if changed
        run: |
          git add koi/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit --quiet -m "koi: update aquarium"
          git push --quiet
